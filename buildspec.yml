version: 0.2

phases:
  install:
    runtime-versions:
      java: corretto17

  pre_build:
    commands:
      - echo "Starting build _______________________________________ "
      - ls -la
  build:
    commands:
      - mvn clean test
      - mvn package
      - chmod +x scripts/*.sh

  post_build:
    commands:
      - echo "Build completed ************************************************"

artifacts:
  files:
    - target/*.jar
    - appspec.yml
    - scripts/**/*
  discard-paths: yes
