version: 0.2

phases:
  install:
    runtime-versions:
      java: corretto17

  pre_build:
    commands:
      - echo "Starting build"
      - ls -la
      - if [ -f appspec.yml ]; then echo "appspec.yml present"; else echo "ERROR: appspec.yml missing at repo root"; exit 1; fi
      - if [ -d scripts ]; then echo "scripts folder present"; else echo "ERROR: scripts folder missing at repo root"; exit 1; fi

  build:
    commands:
      - mvn clean test
      - mvn package
      - chmod +x scripts/*.sh

  post_build:
    commands:
      - echo "Build completed"

artifacts:
  files:
    - target/*.jar
    - appspec.yml
    - scripts/**/*
  discard-paths: yes
